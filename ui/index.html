<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CEVTUO-RWP</title>
<link rel="icon" href="/logo.png"/>
<style>
/* ==========================================================================
   设计令牌 —— Liquid Glass
   --glass (0..1) 由设置里的滑块控制,同时驱动模糊半径、透明度与高光强度
   ========================================================================== */
:root{
  --glass: 0.62;
  --blur: calc(6px + 34px * var(--glass));
  --alpha: calc(0.34 + 0.52 * var(--glass));
  --alpha-strong: calc(0.55 + 0.42 * var(--glass));
  --radius-xl: 26px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --ease: cubic-bezier(.32,.72,0,1);
}
html[data-theme="light"]{
  --bg1:#eef2f8; --bg2:#dfe7f3; --bg3:#f6f0f6; --bg4:#e6eef7;
  --ink:#12161d; --ink-soft:#4a5261; --ink-faint:#79839a;
  --panel: 255,255,255;
  --line: rgba(255,255,255,.72);
  --line-soft: rgba(120,135,160,.22);
  --accent:#2f6feb; --accent-ink:#fff;
  --ok:#0f7a3d; --warn:#a35a06; --err:#c03636;
  --spec: rgba(255,255,255,.95);
  --shadow: 0 10px 34px rgba(38,52,80,.13), 0 2px 8px rgba(38,52,80,.07);
  --side-ink:#1b2029;
  --side-ink-soft:#525c6d;
}
html[data-theme="dark"]{
  --bg1:#0c1017; --bg2:#141b26; --bg3:#1b1524; --bg4:#0f1a22;
  --ink:#eef2f8; --ink-soft:#a9b4c6; --ink-faint:#7b8698;
  --panel: 22,28,38;
  --line: rgba(255,255,255,.13);
  --line-soft: rgba(255,255,255,.09);
  --accent:#5b93ff; --accent-ink:#08111f;
  --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
  --spec: rgba(255,255,255,.55);
  --shadow: 0 14px 40px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35);
  --side-ink:#f2f6fc;
  --side-ink-soft:#b6c1d3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--bg1); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 背后的光效层:缓慢流动的几团色光,玻璃面板才会"透"出变化。
   注意:深色模式下不要用接近底色的色块(等于看不见),也不要用大块白色
   —— 之前那版就是一块 26vw 的白色 35% 铺在深底上,糊成一团灰雾。 */
.aurora{position:fixed;inset:-20%;z-index:0;filter:blur(80px);opacity:calc(.42 + .30*var(--glass));}
.aurora i{position:absolute;display:block;border-radius:50%}
html[data-theme="light"] .aurora i{opacity:.85}
html[data-theme="dark"]  .aurora i{opacity:.42}
/* 冷蓝 / 紫 / 青,两侧各一团,中央留一条淡的做高光 */
.aurora .a{width:44vw;height:44vw;left:-4%;top:-2%;background:#5b8cff;animation:drift1 34s var(--ease) infinite alternate}
.aurora .b{width:38vw;height:38vw;right:-2%;top:6%;background:#a97bff;animation:drift2 41s var(--ease) infinite alternate}
.aurora .c{width:48vw;height:48vw;left:16%;bottom:-20%;background:#37d4c4;animation:drift3 47s var(--ease) infinite alternate}
.aurora .d{width:16vw;height:16vw;left:52%;top:26%;background:#ffffff;opacity:.18;animation:drift1 29s var(--ease) infinite alternate-reverse}
html[data-theme="light"] .aurora{filter:blur(95px)}
html[data-theme="light"] .aurora i{opacity:.34}
@keyframes drift1{to{transform:translate3d(9vw,7vh,0) scale(1.14)}}
@keyframes drift2{to{transform:translate3d(-11vw,9vh,0) scale(1.09)}}
@keyframes drift3{to{transform:translate3d(7vw,-9vh,0) scale(1.16)}}
@media (prefers-reduced-motion: reduce){.aurora i{animation:none}}

button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---- 玻璃基类 ---- */
.glass{
  background:rgba(var(--panel),var(--alpha));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--line);
  box-shadow:var(--shadow), inset 0 1px 0 var(--spec), inset 0 -1px 0 rgba(255,255,255,.10);
  border-radius:var(--radius-lg);
}
.glass-soft{
  background:rgba(var(--panel),calc(var(--alpha) * .62));
  backdrop-filter:blur(calc(var(--blur) * .7)) saturate(160%);
  -webkit-backdrop-filter:blur(calc(var(--blur) * .7)) saturate(160%);
  border:1px solid var(--line-soft);
  border-radius:var(--radius-md);
}

.app{position:relative;z-index:1;display:flex;height:100vh;padding:12px;gap:12px}

/* ===================== 左侧栏:银玻璃,从底板上"划"上来的一块 ===================== */
.side{
  width:228px;flex:none;display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--radius-xl);
  background:
    linear-gradient(160deg,
      rgba(255,255,255,calc(.62 + .3*var(--glass))) 0%,
      rgba(228,234,244,calc(.48 + .3*var(--glass))) 42%,
      rgba(198,208,224,calc(.42 + .3*var(--glass))) 100%);
  backdrop-filter:blur(calc(var(--blur)*1.1)) saturate(190%);
  -webkit-backdrop-filter:blur(calc(var(--blur)*1.1)) saturate(190%);
  border:1px solid rgba(255,255,255,.62);
  box-shadow:
    0 18px 46px rgba(30,44,70,.22),
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,255,255,.35),
    inset 1px 0 0 rgba(255,255,255,.55);
}
html[data-theme="dark"] .side{
  background:
    linear-gradient(160deg,
      rgba(214,224,240,calc(.20 + .28*var(--glass))) 0%,
      rgba(150,166,190,calc(.14 + .24*var(--glass))) 45%,
      rgba(88,102,126,calc(.16 + .24*var(--glass))) 100%);
  border-color:rgba(255,255,255,.20);
}
/* 银色玻璃顶部的一道斜向高光 */
.side::after{
  content:"";position:absolute;inset:0;border-radius:var(--radius-xl);pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 34%,
    rgba(255,255,255,0) 66%,rgba(255,255,255,.30) 100%);
  mix-blend-mode:screen;opacity:calc(.35 + .5*var(--glass));
}
.brand{position:relative;z-index:2;display:flex;align-items:center;gap:10px;
  padding:18px 16px 14px}
/* logo 本身已经是去底的透明图,不要再给它套圆角方块/描边边框。
   阴影改用 drop-shadow —— 它沿着玫瑰的轮廓走,而不是围出一个方框。 */
.brand img{width:42px;height:42px;flex:none;background:none;border:0;
  box-shadow:none;filter:drop-shadow(0 2px 6px rgba(30,44,70,.30))}
html[data-theme="dark"] .brand img{filter:drop-shadow(0 2px 7px rgba(0,0,0,.55))}
.brand .tx{min-width:0}
.brand b{display:block;font-size:14.5px;letter-spacing:.3px;color:var(--side-ink);
  text-shadow:0 1px 0 rgba(255,255,255,.55);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10.5px;color:var(--side-ink-soft);
  text-shadow:0 1px 0 rgba(255,255,255,.4)}
html[data-theme="dark"] .brand b{text-shadow:0 1px 2px rgba(0,0,0,.5)}
html[data-theme="dark"] .brand small{text-shadow:0 1px 2px rgba(0,0,0,.5)}

.nav{position:relative;z-index:2;padding:4px 10px;flex:1;overflow:auto}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:3px;
  background:rgba(255,255,255,0);border:1px solid rgba(255,255,255,0);
  border-radius:var(--radius-md);cursor:pointer;text-align:left;font-size:13.5px;
  color:var(--side-ink);text-shadow:0 1px 0 rgba(255,255,255,.5);
  transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease);
}
html[data-theme="dark"] .nav button{text-shadow:0 1px 2px rgba(0,0,0,.55)}
.nav button:hover{background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.5)}
html[data-theme="dark"] .nav button:hover{background:rgba(255,255,255,.10)}
.nav button.on{
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.42));
  border-color:rgba(255,255,255,.85);font-weight:600;
  box-shadow:0 4px 14px rgba(30,44,70,.16), inset 0 1px 0 rgba(255,255,255,.95);
}
html[data-theme="dark"] .nav button.on{
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.10));
  border-color:rgba(255,255,255,.3);
}
/* 侧边栏图标改用 SVG 描边图标。
   早先用的是 ▦ ≋ ▤ 这类 Unicode 字符,长什么样完全取决于机器上装了什么字体,
   换台电脑就可能变成方框或错位。 */
.nav .ico{width:19px;height:19px;flex:none;display:block;opacity:.85}
.nav button.on .ico{opacity:1}
.nav button:hover .ico{opacity:.95}
.sidefoot{position:relative;z-index:2;padding:12px 16px;font-size:10.5px;
  color:var(--side-ink-soft);border-top:1px solid rgba(255,255,255,.4)}

/* ===================== 主区 ===================== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;gap:12px}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px;
  border-radius:var(--radius-lg)}
.top h1{font-size:15.5px;margin:0;font-weight:650;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow:auto;padding:2px 2px 70px}

.chip{font-size:11.5px;padding:4px 11px;border-radius:999px;white-space:nowrap;
  background:rgba(var(--panel),.5);border:1px solid var(--line-soft);color:var(--ink-soft);
  backdrop-filter:blur(10px)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent)}
.chip.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 34%,transparent)}
.chip.click{cursor:pointer}
.chip.click:hover{background:rgba(var(--panel),.8)}

/* ---- 控件 ---- */
.btn{padding:7px 14px;border-radius:var(--radius-md);cursor:pointer;white-space:nowrap;
  background:rgba(var(--panel),calc(var(--alpha)*.7));border:1px solid var(--line-soft);
  backdrop-filter:blur(12px);transition:transform .16s var(--ease),background .16s var(--ease);
  box-shadow:0 2px 8px rgba(30,44,70,.06), inset 0 1px 0 var(--spec)}
.btn:hover{background:rgba(var(--panel),calc(var(--alpha)*.95))}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 82%,#000));
  color:var(--accent-ink);border-color:transparent;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 34%,transparent), inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 30%,transparent)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:var(--radius-sm)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{padding:16px 18px;margin-bottom:14px;border-radius:var(--radius-lg)}
.card h3{margin:0 0 12px;font-size:14px;font-weight:640}
.muted{color:var(--ink-faint);font-size:12.5px}
.empty{color:var(--ink-faint);text-align:center;padding:44px 0}
input[type=text],input[type=url],input[type=number],select,textarea{
  padding:8px 11px;border-radius:var(--radius-md);width:100%;
  background:rgba(var(--panel),calc(var(--alpha)*.68));
  border:1px solid var(--line-soft);backdrop-filter:blur(12px);outline:none;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
label.fld{display:block;margin-bottom:11px}
label.fld>span{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{color:var(--ink-faint);font-weight:600;font-size:12px}
tr:hover td{background:rgba(var(--panel),.32)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  background:rgba(var(--panel),.6);border:1px solid var(--line-soft);color:var(--ink-faint)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.tag.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 30%,transparent)}

.ccard{padding:15px 16px;cursor:pointer;border-radius:var(--radius-lg);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.ccard:hover{transform:translateY(-3px)}
.ccard .t{font-weight:600;margin-bottom:5px;word-break:break-word}
.ccard .m{font-size:12px;color:var(--ink-faint)}
.folder{padding:15px 16px;cursor:pointer;border-radius:var(--radius-lg);
  transition:transform .18s var(--ease)}
.folder:hover{transform:translateY(-3px)}
.folder .t{font-weight:600;display:flex;align-items:center;gap:9px}

.ch{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:7px;
  border-radius:var(--radius-md);background:rgba(var(--panel),calc(var(--alpha)*.5));
  border:1px solid var(--line-soft);backdrop-filter:blur(10px)}
.ch:hover{border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.ch .no{width:26px;flex:none;text-align:center;color:var(--ink-faint);font-size:12px}
.ch .ti{flex:1;min-width:0;cursor:pointer}
.ch .ti b{font-weight:520;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .ti small{color:var(--ink-faint);font-size:11.5px;display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* 抓取失败 / 内容不对的章节 —— 整行染成警示色,并在标题下写明原因。
   早先失败的文章根本不会出现在这里,用户以为「少了几章」,而不是
   「这几章失败了、原因是什么」。 */
.ch.warn{border-color:color-mix(in srgb,var(--warn,#d9822b) 46%,transparent);
  background:color-mix(in srgb,var(--warn,#d9822b) 7%,rgba(var(--panel),calc(var(--alpha)*.5)))}
.ch.warn .no{color:var(--warn,#d9822b)}
.chnote{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:11.5px;
  color:var(--warn,#d9822b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chnote svg.ico{width:13px;height:13px;opacity:1}

/* 图标基础尺寸。侧边栏那几条单独在 .nav .ico 里定。 */
svg.ico{width:19px;height:19px;flex:none;display:block;opacity:.85}
.btn svg.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px;
  margin-right:5px;opacity:.9}

/* ---- 在线封面搜索结果 ---- */
.covgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:11px;
  max-height:52vh;overflow:auto;padding:3px}
.covitem{cursor:pointer;border-radius:var(--radius-md);overflow:hidden;
  border:1px solid var(--line-soft);background:rgba(var(--panel),calc(var(--alpha)*.55));
  transition:transform .12s ease,border-color .12s ease}
.covitem:hover{transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.covitem img{width:100%;height:142px;object-fit:cover;display:block;background:#0001}
.covitem span{display:block;padding:5px 7px;font-size:10.5px;color:var(--ink-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- 弹窗 ---- */
.mask{position:fixed;inset:0;background:rgba(12,18,28,.34);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:26px;backdrop-filter:blur(3px)}
.modal{width:100%;max-width:920px;max-height:92vh;display:flex;flex-direction:column;
  overflow:hidden;border-radius:var(--radius-xl);
  background:rgba(var(--panel),var(--alpha-strong));
  backdrop-filter:blur(calc(var(--blur)*1.15)) saturate(190%);
  -webkit-backdrop-filter:blur(calc(var(--blur)*1.15)) saturate(190%);
  border:1px solid var(--line);
  box-shadow:0 30px 80px rgba(10,18,32,.4), inset 0 1px 0 var(--spec);
  animation:pop .26s var(--ease)}
.modal.wide{max-width:1200px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}}
.modal .hd{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;
  align-items:center;gap:10px}
.modal .hd h3{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.modal .bd{padding:18px;overflow:auto;flex:1}
.modal .ft{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;
  gap:9px;justify-content:flex-end;align-items:center}
.x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;
  color:var(--ink-faint);padding:2px 7px;border-radius:8px}
.x:hover{color:var(--ink);background:rgba(var(--panel),.6)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-faint);
  border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:640}

.prog{height:8px;border-radius:999px;overflow:hidden;background:rgba(var(--panel),.55);
  border:1px solid var(--line-soft)}
.prog i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));
  transition:width .35s var(--ease)}
.logbox{border-radius:var(--radius-md);padding:12px 14px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:250px;overflow:auto;
  white-space:pre-wrap;word-break:break-all;
  background:rgba(10,14,20,.86);color:#cfd8e6;border:1px solid rgba(255,255,255,.10)}
html[data-theme="light"] .logbox{background:rgba(24,30,40,.9)}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0;cursor:pointer}
.chk input{width:auto}
.preview{padding:18px 22px;max-height:58vh;overflow:auto;line-height:1.78;
  border-radius:var(--radius-md);background:rgba(var(--panel),calc(var(--alpha)*.66));
  border:1px solid var(--line-soft)}
.preview img{max-width:100%;height:auto}
.editarea{padding:18px 22px;min-height:52vh;max-height:58vh;overflow:auto;line-height:1.78;
  outline:none;border-radius:var(--radius-md);background:rgba(var(--panel),calc(var(--alpha)*.66));
  border:1px solid var(--line-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
.kv b{color:var(--ink-faint);font-weight:500}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line-soft);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:99;
  padding:11px 20px;border-radius:var(--radius-lg);font-size:13px;max-width:80vw;
  background:rgba(var(--panel),var(--alpha-strong));backdrop-filter:blur(var(--blur));
  border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .22s var(--ease)}
code{background:rgba(var(--panel),.6);padding:2px 6px;border-radius:6px;font-size:12px;
  border:1px solid var(--line-soft)}

/* ---- 滑杆 ---- */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 25%,transparent));
  outline:none;padding:0;border:0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:linear-gradient(180deg,#fff,#dfe6f0);cursor:pointer;
  box-shadow:0 3px 10px rgba(20,35,60,.35), inset 0 1px 0 #fff;
  border:1px solid rgba(255,255,255,.9)}
/* ---- 分段控件 ---- */

let LANG = (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
const t = k => (I18N[LANG] && I18N[LANG][k]) || (I18N.zh[k]) || k;
function applyStaticI18n(){
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n; if(I18N[LANG][k]) el.textContent = I18N[LANG][k];
  });
}

/* ============================== 基础 ============================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}},opt));
  const txt = await r.text();
  let j; try{ j = txt? JSON.parse(txt):{}; }catch(e){ throw new Error('Bad JSON: '+txt.slice(0,180)); }
  if(!r.ok && j.err) throw new Error(j.err);
  return j;
}
const get = p => api(p);
const post = (p,b) => api(p,{method:'POST',body:JSON.stringify(b||{})});
function toast(msg,ms=2800){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),ms);
}
const fmtSize = n => n>1048576? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB';

/* ============================== 全局 ============================== */
const S = { state:null, ui:{theme:'auto',glass:0.62,lang:null} };

function applyTheme(){
  let th = S.ui.theme || 'auto';
  if(th === 'auto') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = th;
}
function applyGlass(v){ document.documentElement.style.setProperty('--glass', String(v)); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(S.ui.theme==='auto') applyTheme(); });

async function refreshState(){
  try{
    const s = await get('/api/state'); S.state = s;
    const ui = s.settings.ui || {};
    let changed = false;
    if(ui.theme && ui.theme !== S.ui.theme){ S.ui.theme = ui.theme; applyTheme(); }
    if(typeof ui.glass === 'number' && ui.glass !== S.ui.glass){ S.ui.glass = ui.glass; applyGlass(ui.glass); }
    if(ui.lang && ui.lang !== (S.ui.lang||'')){ S.ui.lang = ui.lang; if(I18N[ui.lang]){ LANG = ui.lang; applyStaticI18n(); changed = true; } }
    const c = $('#chipChrome');
    c.className = 'chip click ' + (s.capture?.chrome_running ? 'ok' : 'warn');
    c.textContent = s.capture?.chrome_running ? `Chrome :${s.capture.port}` : 'Chrome —';
    c.title = t('set.browser');
    const running = (s.jobs||[]).find(j=>j.status==='running'||j.status==='queued');
    const cj = $('#chipJob');
    if(running){
      cj.style.display=''; cj.className='chip ok';
      cj.innerHTML = '<span class="spinner"></span> '+esc(running.title)+' '+(running.total?running.done+'/'+running.total:'');
      cj.onclick = ()=>openJob(running.id);
    } else cj.style.display='none';
    $('#sidefoot').textContent = s.capture?.chrome_running ? t('footer.chrome') : t('footer.ready');
    if(changed) setView(S.view, S.viewArg);
  }catch(e){}
}

function setView(v,arg){
  S.view=v; S.viewArg=arg;
  $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v || (v==='collection'&&b.dataset.v==='collections')));
  ({collections:renderCollections, collection:()=>renderCollection(arg),
    rss:renderRss, library:renderLibrary, settings:renderSettings}[v]||renderCollections)();
}
$$('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

async function renderCollections(){
  $('#title').textContent = t('coll.title');
  const r = await get('/api/collections');
  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <button class="btn primary" id="newColl">${t('coll.new')}</button>
      <span class="muted">${LANG==='zh'?'一个合集 = 一本电子书;每篇文章 = 一个章节':'One collection = one book; each article = a chapter'}</span>
    </div>
    <div class="grid" id="cgrid"></div>`;
  $('#newColl').onclick = newCollectionModal;
  const g = $('#cgrid');
  if(!r.collections.length){ g.innerHTML = `<div class="empty" style="grid-column:1/-1">${t('coll.empty')}</div>`; return; }
  g.innerHTML = r.collections.map(c=>`<div class="ccard glass" data-id="${c.id}">
      <div class="t">${esc(c.title)}</div>
      <div class="m">${c.ready}/${c.count} ${t('coll.ready')} · ${esc(c.language_code||'')}</div>
    </div>`).join('');
  $$('.ccard',g).forEach(el=>el.onclick=()=>setView('collection', el.dataset.id));
}

  const langs=['zh-CN','zh-TW','en','ja'];
  $('#view').innerHTML = `
    <div class="card glass">
      <div class="row" style="align-items:flex-start">
        <div style="width:80px;height:110px;flex:none;border-radius:var(--radius-md);
          border:1px solid var(--line-soft);background:rgba(var(--panel),.5) center/cover no-repeat;
          ${c.cover?`background-image:url('/api/cover?id=${encodeURIComponent(c.id)}&v=${Date.now()}')`:''}"></div>
        <div class="grow">
          <div class="row" style="margin-bottom:9px">
            <input type="text" id="cTitle" value="${esc(c.title)}" style="max-width:330px"/>
            <input type="text" id="cAuthor" value="${esc(c.author||'')}" placeholder="${t('coll.author')}" style="max-width:170px"/>
            <select id="cLang" style="width:auto">${langs.map(l=>`<option ${l===c.language_code?'selected':''}>${l}</option>`).join('')}</select>
          </div>
          <div class="row">
            <button class="btn" id="saveMeta">${t('coll.saveMeta')}</button>
            <label class="btn" style="cursor:pointer">${t('coll.cover')}<input type="file" id="coverFile" accept="image/*" style="display:none"/></label>
            <button class="btn" id="findCover"><svg class="ico"><use href="#i-image"/></svg><span>${t('cov.search')}</span></button>
            <button class="btn primary" id="btnImport">${t('common.import')}</button>
            <button class="btn" id="btnExport">${t('common.export')}</button>
            <button class="btn danger" id="btnDelColl">${t('coll.del')}</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card glass">
      <div class="row" style="margin-bottom:10px">
        <h3 style="margin:0;flex:1">${t('common.chapters')} <span class="muted" id="chCount"></span></h3>
        <button class="btn sm" id="addBlank">${t('common.blank')}</button>
        <button class="btn sm" id="addByUrl">${t('common.fromUrl')}</button>
      </div>
      <div id="chList"></div>
    </div>`;
  $('#saveMeta').onclick = async ()=>{
    await post('/api/collection/save',{id:cid,title:$('#cTitle').value.trim(),
      author:$('#cAuthor').value.trim(),language_code:$('#cLang').value});
    toast(t('common.save')); renderCollection(cid); };
  $('#coverFile').onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload = async ()=>{
      try{ await post('/api/collection/cover',{id:cid,data_url:fr.result}); }
      catch(err){ toast(String(err.message||err)); return; }
      renderCollection(cid); };
    fr.readAsDataURL(f); };
  $('#findCover').onclick = ()=>coverSearchModal(cid, c.title);
  $('#btnImport').onclick = ()=>importModal(cid);
  $('#btnExport').onclick = ()=>exportModal(cid);
  $('#btnDelColl').onclick = async ()=>{
    if(!confirm(t('coll.delConfirm'))) return;
    await post('/api/collection/delete',{id:cid}); setView('collections'); };
  $('#addBlank').onclick = async ()=>{
    await post('/api/article/add',{collectionId:cid,title:LANG==='zh'?'新页面':'New page',parsed_html:'<p></p>'});
    loadChapters(cid); };

          <label class="chk"><input type="checkbox" id="auChrome" checked/> ${t('imp.useChrome')}</label>`,
    okText:t('common.ok'),
    onOk: async ()=>{
      const u=$('#auUrl').value.trim(); if(!u) return false;
      const r = await post('/api/article/addUrl',{collectionId:cid,url:u,useChrome:$('#auChrome').checked});
      if(!r.ok){ toast(r.err); return false; }
      closeModal(); loadChapters(cid); }});
  loadChapters(cid);
}

async function loadChapters(cid){
  const r = await get('/api/articles?collection='+encodeURIComponent(cid));
  const A = r.articles;
  $('#chCount').textContent = A.length + ' ' + t('coll.chapters');
  const box = $('#chList');
  if(!A.length){ box.innerHTML = `<div class="empty">${t('ch.empty')}</div>`; return; }
  box.innerHTML = A.map((a,i)=>`<div class="ch${a.note?' warn':''}">
      <div class="no">${i+1}</div>
      <div class="ti" data-open="${a.id}"><b>${esc(a.title||'')}</b>
        <small>${a.body_len? a.body_len+(LANG==='zh'?' 字':' ch'):'—'} · ${esc(a.url||a.source||'')} · ${esc(a.mode||'')}</small>
        ${a.note?`<span class="chnote" title="${esc(a.note)}"><svg class="ico"><use href="#i-warn"/></svg><span>${esc(a.note)}</span></span>`:''}</div>
      <button class="btn sm" data-up="${a.id}" title="${t('ch.up')}">↑</button>
      <button class="btn sm" data-dn="${a.id}" title="${t('ch.down')}">↓</button>
      <button class="btn sm" data-re="${a.id}"><svg class="ico"><use href="#i-refresh"/></svg><span>${t('ch.refetch')}</span></button>
      <button class="btn sm" data-open2="${a.id}">${t('common.viewEdit')}</button>
      <button class="btn sm danger" data-del="${a.id}">${t('common.delete')}</button>
    </div>`).join('');
  $$('[data-open]',box).forEach(e=>e.onclick=()=>openArticle(e.dataset.open,()=>loadChapters(cid)));
  $$('[data-open2]',box).forEach(e=>e.onclick=()=>openArticle(e.dataset.open2,()=>loadChapters(cid)));
  $$('[data-up]',box).forEach(e=>e.onclick=async()=>{await post('/api/article/move',{id:e.dataset.up,delta:-1,collectionId:cid});loadChapters(cid);});
  $$('[data-dn]',box).forEach(e=>e.onclick=async()=>{await post('/api/article/move',{id:e.dataset.dn,delta:1,collectionId:cid});loadChapters(cid);});
  $$('[data-del]',box).forEach(e=>e.onclick=async()=>{
    if(!confirm(t('ch.delConfirm'))) return;
    await post('/api/article/delete',{id:e.dataset.del}); loadChapters(cid);});
  // 「再次获取」—— 任何一章都能点,不只是标了警告的
  $$('[data-re]',box).forEach(e=>e.onclick=async()=>{
    const old = e.innerHTML;
    e.disabled = true; e.textContent = t('ch.refetching');
    let r=null, thrown='';
    try{ r = await post('/api/article/refetch',{id:e.dataset.re}); }
    catch(x){ thrown = x.message||String(x); }
    e.disabled = false; e.innerHTML = old;
    if(r && r.ok) toast(t('ch.refetchOk').replace('{n}', r.chars));
    else toast(t('ch.refetchFail')+' '+((r&&r.err)||thrown));
    loadChapters(cid);
  });
}

async function openArticle(aid,onSaved){
  const a = await get('/api/article?id='+encodeURIComponent(aid));
  const st = {mode:'preview', html:a.parsed_html||''};
  const m = modal({title:a.title||'', wide:true,
    body:`<label class="fld"><span>${t('ch.title')}</span><input type="text" id="aTitle" value="${esc(a.title||'')}"/></label>
      <div class="row" style="margin-bottom:10px">
        <div class="tabs" style="border:0;margin:0">
          <button id="tabPv" class="on">${t('ch.preview')}</button>
          <button id="tabEd">${t('ch.editBody')}</button>
          <button id="tabHtml">${t('ch.html')}</button></div>
        <span class="grow"></span>
        ${a.url?`<a class="btn sm" href="${esc(a.url)}" target="_blank">${t('ch.openSrc')}</a>`:''}
      </div><div id="pane"></div>`,
    okText:t('common.save'),
    onOk: async ()=>{
      st.html = readPane();
      await post('/api/article/save',{id:aid,title:$('#aTitle').value.trim(),parsed_html:st.html});
      toast(t('common.save')); if(onSaved) onSaved(); }});
  const pane = $('#pane',m);
  function readPane(){ const e=$('#edBox'),h=$('#htmlBox'); return e? e.innerHTML : h? h.value : st.html; }
  function paint(){
    $('#tabPv',m).classList.toggle('on',st.mode==='preview');
    $('#tabEd',m).classList.toggle('on',st.mode==='edit');
    $('#tabHtml',m).classList.toggle('on',st.mode==='html');
    if(st.mode==='preview') pane.innerHTML = `<div class="preview">${st.html||'<p class="muted">—</p>'}</div>`;
    else if(st.mode==='edit') pane.innerHTML = `<div class="editarea" id="edBox" contenteditable="true">${st.html}</div>`;
    else pane.innerHTML = `<textarea id="htmlBox" style="height:54vh">${esc(st.html)}</textarea>`;
  }
  const go = mode => { st.html = readPane(); st.mode = mode; paint(); };
  $('#tabPv',m).onclick=()=>go('preview');
  $('#tabEd',m).onclick=()=>go('edit');
  $('#tabHtml',m).onclick=()=>go('html');
  paint();
}

/* ============================== 导入 ============================== */
/* 在线找封面 —— 三个免费源(Google Books / Open Library / Wikimedia),
   后端合并去重后一次给回来。选中哪张就把图**下载到本地**再设为封面。 */
function coverSearchModal(cid, seed){
  modal({title:t('cov.search'), wide:true, okText:null,
    body:`<div class="row" style="margin-bottom:12px">
        <input type="text" id="covQ" class="grow" value="${esc(seed||'')}" placeholder="${t('cov.searchPh')}"/>
        <button class="btn primary" id="covGo">${t('cov.search')}</button></div>
      <div id="covRes"><div class="empty">—</div></div>`});
  const host = $('#modalHost');
  host.querySelector('.ft').innerHTML = `<button class="btn" onclick="closeModal()">${t('common.close')}</button>`;
  const res = $('#covRes');
  async function go(){
    const q = $('#covQ').value.trim();
    if(!q) return;
    res.innerHTML = `<div class="empty">${t('cov.searching')}</div>`;
    let r=null, err='';
    try{ r = await post('/api/cover/search',{q}); }catch(x){ err = x.message||String(x); }
    if(!r || !r.ok){
      // 区分「一个都没搜到」和「三个源全挂了」—— 前者换个词就行,后者换词也没用
      res.innerHTML = `<div class="empty">${esc((r&&r.err)||err||t('cov.noResult'))}</div>`;
      return;
    }
    if(!r.results.length){ res.innerHTML = `<div class="empty">${t('cov.noResult')}</div>`; return; }
    res.innerHTML = `<div class="covgrid">${r.results.map((x,i)=>
        `<div class="covitem" data-cv="${i}" title="${esc(x.title||x.source)}">
           <img src="${esc(x.thumb)}" loading="lazy" alt=""/>
           <span>${esc(x.source)}</span></div>`).join('')}</div>`;
    $$('[data-cv]',res).forEach(el=>el.onclick=async()=>{
      const x = r.results[+el.dataset.cv];
      el.style.opacity = .45;
      let rr=null, e2='';
      try{ rr = await post('/api/collection/coverUrl',{id:cid,url:x.url}); }
      catch(z){ e2 = z.message||String(z); }
      el.style.opacity = 1;
      if(rr && rr.ok){ closeModal(); renderCollection(cid); }
      else toast(((rr&&rr.err)||e2));
    });
  }
  $('#covGo').onclick = go;
  $('#covQ').onkeydown = e=>{ if(e.key==='Enter') go(); };
  if(seed) go();
}

function importModal(cid){
  let tab='urls';
  const m = modal({title:t('imp.title'), wide:true,
    body:`<div class="tabs">
      <button data-t="urls" class="on">${t('imp.urls')}</button>
      <button data-t="website">${t('imp.website')}</button>
      <button data-t="rss">${t('imp.rss')}</button>
      <button data-t="markdown">${t('imp.md')}</button></div><div id="ipane"></div>`});
  m.querySelector('.ft').innerHTML = `<button class="btn" onclick="closeModal()">${t('common.close')}</button>`;
  const pane = $('#ipane',m);
  $$('.tabs button',m).forEach(b=>b.onclick=()=>{tab=b.dataset.t;
    $$('.tabs button',m).forEach(x=>x.classList.toggle('on',x===b)); paint();});
  const chromeChk = id=>`<label class="chk"><input type="checkbox" id="${id}" checked/> ${t('imp.useChrome')}
      <span class="muted">${t('imp.useChromeNote')}</span></label>`;

  function paint(){
    if(tab==='urls'){
      pane.innerHTML = `
        <label class="fld"><span>${t('imp.urlsHint')}</span>
          <textarea id="uList" rows="10" placeholder="${t('imp.onePerLine')}&#10;https://archive.ph/xxxxx&#10;https://example.com/article"></textarea>
          <span class="muted" id="uCount">${t('imp.onePerLine')}</span></label>
        ${chromeChk('uc')}
        <div class="row" style="margin-top:10px"><button class="btn primary" id="uGo">${t('imp.start')}</button></div>`;
      const ta = $('#uList');
      const count = ()=>{ const n = ta.value.split('\n').map(s=>s.trim()).filter(Boolean).length;
        $('#uCount').textContent = t('msg.pasted').replace('{n}', n); };
      ta.addEventListener('input', count); count();
      $('#uGo').onclick = async ()=>{
        const urls = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
        if(!urls.length){ toast(t('imp.onePerLine')); return; }
        const r = await post('/api/import/urls',{collectionId:cid,urls,useChrome:$('#uc').checked});
        closeModal(); openJob(r.job, ()=>loadChapters(cid)); };
    }
    else if(tab==='website'){
      pane.innerHTML = `
        <div class="row" style="align-items:flex-end">
          <label class="fld grow" style="margin:0"><span>${t('imp.siteUrl')}</span>
            <input type="url" id="wUrl" placeholder="https://example.com/blog"/></label>
          <label class="fld" style="margin:0"><span>${t('imp.src')}</span><select id="wMode">
            <option value="links">${t('imp.srcLinks')}</option>
            <option value="sitemap">${t('imp.srcSitemap')}</option></select></label>
          <button class="btn" id="wLoad">${t('imp.loadLinks')}</button></div>

        <div id="wList" class="muted">—</div>`;

        $('#wList').innerHTML = '<span class="spinner"></span>';
        try{
          const r = await post('/api/import/website/list',{url:$('#wUrl').value.trim(),
            useChrome:$('#wc').checked,sameDomain:$('#wSame').checked,mode:$('#wMode').value});
          if(!r.links.length){ $('#wList').innerHTML = `<div class="empty">0</div>`; return; }
          window.__wl = r.links;
          $('#wList').innerHTML = `
            <div class="row" style="margin-bottom:8px">
              <label class="chk"><input type="checkbox" id="wAll" checked/> ${t('imp.selectAll')}</label>
              <span class="muted">${r.links.length}</span><span class="grow"></span>
              <button class="btn primary sm" id="wGo">${t('imp.importSel')}</button></div>
            <div style="max-height:38vh;overflow:auto;border-radius:var(--radius-md);border:1px solid var(--line-soft)">

            <div class="row" style="margin-bottom:8px">
              <label class="chk"><input type="checkbox" id="rAll" checked/> ${t('imp.selectAll')}</label>
              <span class="muted">${r.items.length}</span><span class="grow"></span>

              <td>${esc(it.title)} ${it.has_full?`<span class="tag ok">${t('imp.rssFull')}</span>`:''}

            </tbody></table></div>`;
          $('#rAll').onchange = e=>$$('.rcb').forEach(c=>c.checked=e.target.checked);
          $('#rGo').onclick = async ()=>{
            const sel = $$('.rcb').filter(c=>c.checked).map(c=>window.__ri[+c.dataset.i]);
            if(!sel.length) return;
            const rr = await post('/api/import/rss/commit',{collectionId:cid,items:sel,useChrome:$('#rc').checked});
            closeModal(); openJob(rr.job, ()=>loadChapters(cid)); };
        }catch(e){ $('#rList').innerHTML = `<span class="tag err">${esc(e.message)}</span>`; }};
    }
    else{
      pane.innerHTML = `
        <label class="fld"><span>${t('imp.mdHint')}</span>
          <textarea id="mdText" rows="16" placeholder="# Article one&#10;text…&#10;&#10;# Article two&#10;text…"></textarea></label>
        <div class="row"><button class="btn primary" id="mdGo">${t('common.import')}</button></div>`;
      $('#mdGo').onclick = async ()=>{
        const text = $('#mdText').value; if(!text.trim()) return;
        const r = await post('/api/import/markdown',{collectionId:cid,text});
        closeModal(); openJob(r.job, ()=>loadChapters(cid)); };
    }
  }
  paint();
}

function watchGen(jid){
  if(!jid) return;
  const box = $('#gProg');
  if(!box || !document.body.contains(box)){ openJob(jid, refreshState); return; }
  box.style.display='';
  const bar = $('#gProg .prog i'), msg = $('#gMsg');
  const timer = setInterval(async ()=>{
    let j; try{ j = await get('/api/job?id='+jid); }catch(e){ return; }
    if(!j || !document.body.contains(box)){ clearInterval(timer); return; }
    const pct = j.total? Math.round(j.done/j.total*100) : (j.status==='running'?6:100);
    bar.style.width = pct+'%';
    msg.textContent = (j.message||'') + (j.total? ` (${j.done}/${j.total})` : '');
    if(j.status!=='running' && j.status!=='queued'){
      clearInterval(timer);
      bar.style.width='100%';
      msg.textContent = (j.status==='done'? t('job.done')+' ' : '') + (j.message||'');
      refreshState();
      if(j.status==='done'){
        const made = (j.result && j.result.made) || [];
        toast(made.length? (t('job.made')+' '+made.join('、')) : t('job.nothing'), 5000);
      }
    }
  }, 1200);
}

  // 平铺之后,索引对不上的书(手动搬过、或别的程序放进去的)也要看得见 ——

    $('#view').insertAdjacentHTML('beforeend',

         <span class="muted">${t('lib.orphanNote')}</span></h3><div class="grid" id="lo"></div></div>`);

function bookListModal(title,books){
  modal({title, wide:true,
    body: books.length? `<table><tbody>${books.map((b,i)=>`<tr data-row="${i}">
        <td>📖 ${esc(b.name)}</td>
        <td class="muted" style="width:1%">${fmtSize(b.size)}</td>
        <td class="muted" style="width:1%">${esc(b.mtime_str)}</td>
        <td style="width:1%"><button class="btn sm" data-bk="${i}" data-read="1">${t('common.open')}</button></td>
        <td style="width:1%"><button class="btn sm" data-bk="${i}" data-read="0">${t('common.reveal')}</button></td>
        <td style="width:1%"><button class="btn sm danger" data-bdel="${i}">${t('common.delete')}</button></td>
      </tr>`).join('')}</tbody></table>` : '<div class="empty">—</div>',
    okText:null});
  // 用 fetch 而不是 <a target=_blank>:原生窗口里外链会被交给默认浏览器,
  // 那样会弹出一个只显示 JSON 的浏览器标签页。
  const host = $('#modalHost');
  host.querySelector('.ft').innerHTML = `<button class="btn" onclick="closeModal()">${t('common.close')}</button>`;
  $$('[data-bk]', host).forEach(el => el.onclick = async ()=>{
    const b = books[+el.dataset.bk];
    if(b) await get('/api/open?target='+encodeURIComponent(b.path)+'&read='+el.dataset.read);
  });
  // 删书 —— 按钮和右键都行。会连本地文件一起删,所以必须二次确认。
  async function delBook(i){
    const b = books[i]; if(!b) return;
    if(!confirm(t('lib.delConfirm').replace('{name}', b.name))) return;
    let r=null, thrown='';
    try{ r = await post('/api/book/delete',{path:b.path}); }catch(x){ thrown = x.message||String(x); }
    if(r && r.ok){ closeModal(); await renderLibrary(); toast(LANG==='zh'?'已删除':'Deleted'); }
    else toast(((r&&r.err)||thrown));
  }
  $$('[data-bdel]', host).forEach(el => el.onclick = ()=>delBook(+el.dataset.bdel));
  $$('[data-row]', host).forEach(el => el.oncontextmenu = ev=>{
    ev.preventDefault(); delBook(+el.dataset.row); });
}

    okText:null});
  $('#modalHost .ft').innerHTML = `<button class="btn" onclick="closeModal()">${t('common.close')}</button>`;
  $('#jCancel').onclick = async ()=>{ await post('/api/job/cancel',{id:jid}); toast(t('job.cancelledReq')); };
  const timer = setInterval(async ()=>{
    let j; try{ j = await get('/api/job?id='+jid); }catch(e){ return; }
    const host = $('#modalHost');
    if(!j || !j.id || !host.querySelector('.prog')){ clearInterval(timer); return; }
    const live = (j.status==='running'||j.status==='queued');
    const pct = j.total? Math.round(j.done/j.total*100) : (live?6:100);
    host.querySelector('.prog i').style.width = pct+'%';
    $('#jStat').textContent = ({running:t('job.running'),done:t('job.done'),error:t('job.error'),
      cancelled:t('job.cancelled'),queued:t('job.queued')})[j.status]||j.status;
    $('#jMsg').textContent = j.message||'';
    const lg = $('#jLog'); if(lg){ lg.textContent=(j.log||[]).join('\n'); lg.scrollTop=lg.scrollHeight; }
    // 结束后:进度条补满、取消按钮消失 —— 之前这里会一直停在半截
    const cb = $('#jCancel');
    if(cb) cb.style.display = live? '' : 'none';
    if(!live){
      clearInterval(timer);
      host.querySelector('.prog i').style.width = '100%';
      if(onDone) onDone(j);
      refreshState();
    }
  }, 1000);
}

/* ============================== 弹窗 ============================== */
function modal(opt){
  closeModal();
  const host = $('#modalHost');
  host.innerHTML = `<div class="mask"><div class="modal ${opt.wide?'wide':''}">
      <div class="hd"><h3>${esc(opt.title)}</h3><button class="x">&times;</button></div>
      <div class="bd">${opt.body}</div>
      <div class="ft"><button class="btn" data-x>${t('common.close')}</button>
        ${opt.onOk?`<button class="btn primary" data-ok>${esc(opt.okText||t('common.ok'))}</button>`:''}</div>
    </div></div>`;
  const el = host.firstElementChild;
  $('.x',el).onclick = closeModal;
  $('[data-x]',el).onclick = closeModal;
  el.onclick = e=>{ if(e.target===el) closeModal(); };
  if(opt.onOk) $('[data-ok]',el).onclick = async ()=>{
    const b=$('[data-ok]',el); b.disabled=true;
    try{ await opt.onOk(); }catch(e){ toast(String(e.message||e)); }finally{ b.disabled=false; }
  };
  return el;
}
function closeModal(){ $('#modalHost').innerHTML=''; }
window.closeModal = closeModal;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ============================== 启动 ============================== */
(async function boot(){
  applyStaticI18n(); applyTheme(); applyGlass(0.62);
  await refreshState();
  setView('collections');
  setInterval(refreshState, 3000);
})();
</script>
